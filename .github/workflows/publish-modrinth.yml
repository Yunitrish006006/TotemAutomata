name: Publish Modrinth

on:
  push:
    branches: [master]
    paths:
      - gradle.properties
      - .github/staging/modrinth-changelog-*.md
      - .github/workflows/publish-modrinth.yml
      - .github/scripts/check-modrinth-release-gate.sh
      - .github/scripts/modrinth-error-summary.jq
      - .github/scripts/modrinth-dependency-summary.jq
      - .github/scripts/normalize-modrinth-dry-run.sh
      - .github/scripts/verify-modrinth-remote-dependencies.jq
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: 'modrinth-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

env:
  MODULE_ID: totem-automata
  CORE_REF: 424b90dc3929caa8c1afcfca7e63c50a64bde669
  EXCAVATION_REF: 87bc24076b9fb6fe3a64504f7b638d4ec0767c7c
  FABRIC_API_PROJECT_ID: P7dR8mSH
  TOTEM_EXCAVATION_REFERENCE_VERSION_ID: PENDING_EXCAVATION_0_1_15_VERSION_ID
  TOTEM_CORE_DEPENDENCY_FILE: totem-core-0.7.23.jar
  TOTEM_EXCAVATION_DEPENDENCY_FILE: totem-excavation-0.1.16.jar

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Check out Automata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release source
        id: release
        shell: bash
        env:
          EVENT_NAME: '${{ github.event_name }}'
          BEFORE_SHA: '${{ github.event.before }}'
          REQUESTED_DRY_RUN: '${{ inputs.dry_run }}'
        run: |
          set -euo pipefail
          fail_release_source() {
            echo "Release source validation failed: $1" >&2
            exit 1
          }

          current="$(sed -n 's/^mod_version=//p' gradle.properties)"
          [[ -n "$current" ]] \
            || fail_release_source 'gradle.properties has no mod_version.'

          should_publish=false
          dry_run=false
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            should_publish=true
            if ! dry_run="$(.github/scripts/normalize-modrinth-dry-run.sh "${REQUESTED_DRY_RUN:-true}")"; then
              fail_release_source 'manual dry_run input is invalid.'
            fi
          else
            changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" 2>/dev/null || true)"
            previous="$(git show "${BEFORE_SHA}:gradle.properties" 2>/dev/null \
              | sed -n 's/^mod_version=//p' || true)"
            if [[ -z "$previous" || "$previous" != "$current" ]] \
                || grep -Eq '^\.github/(staging/modrinth-changelog-.*\.md|workflows/publish-modrinth\.yml|scripts/(check-modrinth-release-gate\.sh|modrinth-error-summary\.jq|modrinth-dependency-summary\.jq|normalize-modrinth-dry-run\.sh|verify-modrinth-remote-dependencies\.jq))$' <<<"$changed"; then
              should_publish=true
            fi
          fi

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Verify release gate
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        run: .github/scripts/check-modrinth-release-gate.sh

      - name: Require exact-source release gates
        id: gates
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          echo "source=$release_sha" >> "$GITHUB_OUTPUT"
          for workflow in build.yml production-runtime.yml; do
            passed=false
            for attempt in {1..360}; do
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${release_sha}&event=push&per_page=10")"
              latest="$(jq -c '.workflow_runs | sort_by(.run_number) | last // null' <<<"$runs")"
              if [[ "$(jq -r '.status // empty' <<<"$latest")" == completed ]]; then
                jq -e --arg sha "$release_sha" --arg repo "$GITHUB_REPOSITORY" '.conclusion=="success" and .head_sha==$sha and .event=="push" and .repository.full_name==$repo' <<<"$latest" >/dev/null
                if [[ "$workflow" == build.yml ]]; then
                  echo "run_id=$(jq -er .id <<<"$latest")" >> "$GITHUB_OUTPUT"
                  echo "run_attempt=$(jq -er .run_attempt <<<"$latest")" >> "$GITHUB_OUTPUT"
                fi
                passed=true
                break
              fi
              sleep 10
            done
            [[ "$passed" == true ]] || { echo "Timed out waiting for ${workflow}; refusing publication." >&2; exit 1; }
          done

      - name: Resolve immutable artifact identity
        id: artifact
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.gates.outputs.run_id }}
          BUILD_RUN_ATTEMPT: ${{ steps.gates.outputs.run_attempt }}
          RELEASE_SHA: ${{ steps.gates.outputs.source }}
        run: |
          set -euo pipefail
          artifacts="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -er --arg name "release-${RELEASE_SHA}-${BUILD_RUN_ATTEMPT}" --arg run "$BUILD_RUN_ID" --arg source "$RELEASE_SHA" '[.[].artifacts[] | select(.name==$name)] | select(length==1) | .[0] | select(.expired==false and .size_in_bytes>0 and .workflow_run.id==($run|tonumber) and .workflow_run.head_sha==$source) | .id' <<<"$artifacts")"
          echo "id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download exact Build artifact
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          merge-multiple: true
          path: build/libs
          repository: ${{ github.repository }}
          run-id: ${{ steps.gates.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify immutable artifact provenance and SHA512
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          BUILD_RUN_ID: ${{ steps.gates.outputs.run_id }}
          BUILD_RUN_ATTEMPT: ${{ steps.gates.outputs.run_attempt }}
          RELEASE_SHA: ${{ steps.gates.outputs.source }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          archive="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          artifact="${archive}-${version}.jar"
          sha="$(sha512sum "build/libs/${artifact}" | awk '{print $1}')"
          expected_sha="$(jq -er .sha512 ".github/staging/release-validation-${version}.json")"
          core_sha="$(jq -er .core_artifact_sha512 ".github/staging/release-validation-${version}.json")"
          [[ "$sha" == "$expected_sha" ]]
          dependency_sha="$(jq -er .excavation_artifact_sha512 ".github/staging/release-validation-${version}.json")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg source "$RELEASE_SHA" --arg run "$BUILD_RUN_ID" --arg attempt "$BUILD_RUN_ATTEMPT" --arg version "$version" --arg artifact "$artifact" --arg sha "$sha" --arg core "$CORE_REF" --arg core_sha "$core_sha" --arg dependency_source "$EXCAVATION_REF" --arg dependency_sha "$dependency_sha" '.repository==$repo and .source_commit==$source and .run_id==$run and .run_attempt==$attempt and .version==$version and .artifact==$artifact and .sha512==$sha and .core_version=="0.7.23" and .core_source_commit==$core and .core_artifact_sha512==$core_sha and .excavation_source_commit==$dependency_source and .excavation_version=="0.1.16" and .excavation_artifact_sha512==$dependency_sha' build/libs/build-provenance.json >/dev/null

      - name: Publish and verify
        id: modrinth
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          DRY_RUN: '${{ steps.release.outputs.dry_run }}'
          EXPECTED_VERSION: '${{ steps.release.outputs.version }}'
          MODRINTH_TOKEN: '${{ secrets.MODRINTH_TOKEN }}'
          MODRINTH_PROJECT_ID: '${{ secrets.MODRINTH_PROJECT_ID }}'
        run: |
          set -euo pipefail
          fail_release() {
            echo "Modrinth publication validation failed: $1" >&2
            exit 1
          }

          case "$DRY_RUN" in
            true|false) ;;
            *) fail_release 'resolved dry_run value must be true or false.' ;;
          esac

          v="$(sed -n 's/^mod_version=//p' gradle.properties)"
          [[ -n "$v" ]] || fail_release 'gradle.properties has no mod_version.'
          [[ "$v" == "$EXPECTED_VERSION" ]] \
            || fail_release 'artifact version does not match the resolved release version.'
          archive="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          [[ -n "$archive" ]] || fail_release 'gradle.properties has no archives_base_name.'
          [[ "$mc" == 26.3 ]] \
            || fail_release 'release Minecraft version must be exactly 26.3.'
          artifact="build/libs/${archive}-${v}.jar"
          [[ -n "$MODRINTH_TOKEN" ]] || fail_release 'MODRINTH_TOKEN is not configured.'
          [[ -n "$MODRINTH_PROJECT_ID" ]] || fail_release 'MODRINTH_PROJECT_ID is not configured.'
          [[ -f "$artifact" ]] || fail_release 'expected release JAR is missing.'

          if ! unzip -p "$artifact" fabric.mod.json >/tmp/fabric.mod.json; then
            fail_release 'release JAR has no readable fabric.mod.json.'
          fi
          if ! jq -e \
              --arg id "$MODULE_ID" \
              --arg v "$v" \
              --arg mc "~${mc}" \
              --arg core '>=0.7.23 <0.8.0' \
              --arg excavation '>=0.1.5' \
              '.id==$id
               and .version==$v
               and .environment=="*"
               and .depends.minecraft==$mc
               and .depends["totem-core"]==$core
               and .suggests["totem-excavation"]==$excavation' \
              /tmp/fabric.mod.json >/dev/null; then
            fail_release 'release JAR Fabric metadata does not match module, version, environment, Minecraft, Core, or Excavation requirements.'
          fi

          api=https://api.modrinth.com/v2
          args=(--silent --show-error --retry 3 \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: Yunitrish006006/${MODULE_ID}-publisher/3.0")

          fetch_modrinth_json() {
            local label="$1"
            local path="$2"
            local output="$3"
            local expected_type="$4"
            local status

            if ! status="$(curl "${args[@]}" --output "$output" \
                --write-out '%{http_code}' "$api/$path")"; then
              echo "Modrinth ${label} lookup failed before an HTTP response was received." >&2
              return 1
            fi
            if [[ "$status" != 200 ]]; then
              echo "Modrinth ${label} lookup returned HTTP ${status}." >&2
              return 1
            fi
            if ! jq -e --arg expected_type "$expected_type" \
                'type == $expected_type' "$output" >/dev/null; then
              echo "Modrinth ${label} lookup returned invalid JSON; expected ${expected_type}." >&2
              return 1
            fi
          }

          fetch_modrinth_json 'release project' \
            "project/${MODRINTH_PROJECT_ID}" /tmp/project.json object
          if ! p="$(jq -er '.id | strings | select(length > 0)' /tmp/project.json)"; then
            fail_release 'release project response has no project ID.'
          fi
          [[ "$p" == "$MODRINTH_PROJECT_ID" ]] \
            || fail_release 'release project lookup returned a different project identity.'
          if ! jq -e '.project_type == "mod"' /tmp/project.json >/dev/null; then
            fail_release 'configured Modrinth project is not a mod project.'
          fi
          if ! project_summary="$(jq -er '
              select((.title | type == "string" and length > 0)
                     and (.slug | type == "string" and length > 0)
                     and (.status | type == "string" and length > 0)
                     and (.requested_status == null
                          or (.requested_status | type == "string" and length > 0)))
              | "Modrinth release project: title=\(.title), slug=\(.slug), status=\(.status), requested_status=\(.requested_status // "none"), project_type=\(.project_type)."
            ' /tmp/project.json)"; then
            fail_release 'release project response is missing non-sensitive status metadata.'
          fi
          echo "$project_summary"

          if ! sha="$(sha512sum "$artifact" | awk '{print $1}')" \
              || [[ ! "$sha" =~ ^[0-9a-f]{128}$ ]]; then
            fail_release 'could not calculate a valid SHA-512 for the release JAR.'
          fi

          core_version="$(jq -er .core_version build/libs/build-provenance.json)"
          excavation_version="$(jq -er .excavation_version build/libs/build-provenance.json)"
          excavation_sha="$(jq -er .excavation_artifact_sha512 build/libs/build-provenance.json)"
          core_dependency_file="totem-core-${core_version}.jar"
          excavation_dependency_file="totem-excavation-${excavation_version}.jar"
          [[ "$core_dependency_file" == "$TOTEM_CORE_DEPENDENCY_FILE" ]] \
            || fail_release 'pinned TotemCore reference artifact is not exactly totem-core-0.7.23.jar.'
          [[ "$excavation_dependency_file" == "$TOTEM_EXCAVATION_DEPENDENCY_FILE" ]] \
            || fail_release 'pinned TotemExcavation reference artifact is not exactly totem-excavation-0.1.16.jar.'
          [[ "$TOTEM_EXCAVATION_REFERENCE_VERSION_ID" != PENDING_* ]] \
            || fail_release 'TotemExcavation 0.1.16 publication version ID is pending.'

          fetch_modrinth_json 'TotemExcavation dependency version' \
            "version/${TOTEM_EXCAVATION_REFERENCE_VERSION_ID}" \
            /tmp/excavation-dependency-version.json object
          if ! excavation_dependency_project="$(jq -er \
              --arg id "$TOTEM_EXCAVATION_REFERENCE_VERSION_ID" \
              --arg version "$excavation_version" \
              --arg file "$excavation_dependency_file" \
              --arg sha "$excavation_sha" \
              --arg mc "$mc" \
              'select(.id == $id
                      and .version_number == $version
                      and .version_type == "release"
                      and (.game_versions | type) == "array"
                      and (.game_versions | index($mc)) != null
                      and (.loaders | type) == "array"
                      and (.loaders | index("fabric")) != null
                      and (.files | type) == "array"
                      and any(.files[]; .filename == $file and .primary == true and .hashes.sha512 == $sha))
               | .project_id | strings | select(length > 0)' \
              /tmp/excavation-dependency-version.json)"; then
            fail_release 'TotemExcavation dependency reference does not resolve to the pinned 0.1.16 artifact.'
          fi
          [[ "$excavation_dependency_project" != "$FABRIC_API_PROJECT_ID" \
              && "$excavation_dependency_project" != "$p" ]] \
            || fail_release 'resolved Modrinth dependency projects must be distinct.'

          if ! deps="$(jq -nce \
              --arg fabric "$FABRIC_API_PROJECT_ID" \
              --arg core_file "$core_dependency_file" \
              --arg excavation "$excavation_dependency_project" \
              '[
                {project_id:$fabric,dependency_type:"required"},
                {file_name:$core_file,dependency_type:"required"},
                {project_id:$excavation,dependency_type:"optional"}
              ]')"; then
            fail_release 'could not construct the exact three Modrinth dependencies.'
          fi

          changelog_file=".github/staging/modrinth-changelog-${v}.md"
          [[ -f "$changelog_file" ]] \
            || fail_release 'versioned Modrinth changelog is missing.'
          c="$(<"$changelog_file")"
          [[ -n "$c" ]] || fail_release 'release changelog is empty.'

          if ! data="$(jq -nce \
              --arg n "${MODULE_ID} ${v}" \
              --arg v "$v" \
              --arg c "$c" \
              --arg p "$p" \
              --arg mc "$mc" \
              --argjson deps "$deps" \
              '{
                name:$n,
                version_number:$v,
                changelog:$c,
                dependencies:$deps,
                game_versions:[$mc],
                version_type:"release",
                loaders:["fabric"],
                featured:false,
                status:"listed",
                project_id:$p,
                file_parts:["primary"],
                primary_file:"primary",
                environment:"client_and_server"
              }')"; then
            fail_release 'could not construct Modrinth version creation metadata.'
          fi
          if ! jq -e \
              --arg p "$p" \
              --arg v "$v" \
              --arg mc "$mc" \
              --arg fabric "$FABRIC_API_PROJECT_ID" \
              --arg core_file "$core_dependency_file" \
              --arg excavation "$excavation_dependency_project" \
              '.project_id==$p
               and .version_number==$v
               and .version_type=="release"
               and .game_versions==[$mc]
               and .loaders==["fabric"]
               and .environment=="client_and_server"' \
              <<<"$data" >/dev/null \
              || ! jq -e \
                --arg fabric "$FABRIC_API_PROJECT_ID" \
                --arg core_file "$core_dependency_file" \
                --arg excavation "$excavation_dependency_project" \
                -f .github/scripts/verify-modrinth-remote-dependencies.jq \
                <<<"$data" >/dev/null; then
            fail_release 'constructed release metadata does not match release, Minecraft 26.3, Fabric, client_and_server, or exact dependency requirements.'
          fi

          fetch_modrinth_json 'release versions' \
            "project/${p}/version?include_changelog=false" /tmp/versions.json array
          if ! count="$(jq -er --arg v "$v" \
              '[.[] | select(.version_number==$v)] | length' /tmp/versions.json)"; then
            fail_release 'could not count matching existing Modrinth versions.'
          fi

          id=""
          if [[ "$count" == 1 ]]; then
            if ! id="$(jq -er --arg v "$v" \
                '.[] | select(.version_number==$v) | .id | strings | select(length > 0)' \
                /tmp/versions.json)"; then
              fail_release 'existing Modrinth version has no version ID.'
            fi
            if ! remote_sha="$(jq -er --arg v "$v" \
                '.[] | select(.version_number==$v)
                 | (([.files[] | select(.primary==true)][0] // .files[0]).hashes.sha512)
                 | strings | select(length > 0)' /tmp/versions.json)"; then
              fail_release 'existing Modrinth version has no primary-file SHA-512.'
            fi
            [[ "$remote_sha" == "$sha" ]] \
              || fail_release "version ${v} already exists with a different artifact SHA-512; refusing to overwrite it. Bump mod_version."
          elif [[ "$count" != 0 ]]; then
            fail_release "found ${count} existing Modrinth versions numbered ${v}; expected at most one."
          fi

          if [[ "$DRY_RUN" == true && -z "$id" ]]; then
            echo "Validated Modrinth metadata for ${v} (release); dependency references=${FABRIC_API_PROJECT_ID},${TOTEM_CORE_DEPENDENCY_FILE},${TOTEM_EXCAVATION_REFERENCE_VERSION_ID}."
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "sha512=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$id" ]]; then
            printf '%s\n' "$data" > /tmp/version-data.json
            if ! jq -e 'type == "object"' /tmp/version-data.json >/dev/null; then
              fail_release 'serialized Modrinth version creation metadata is not a JSON object.'
            fi
            if ! create_status="$(curl "${args[@]}" -X POST "$api/version" \
                -F 'data=</tmp/version-data.json;type=application/json' \
                -F "primary=@${artifact};filename=$(basename "$artifact");type=application/java-archive" \
                --output /tmp/version.json --write-out '%{http_code}')"; then
              echo 'Modrinth version creation failed before an HTTP response was received.' >&2
              exit 1
            fi
            if [[ "$create_status" != 200 ]]; then
              if create_error_summary="$(jq -c \
                  -f .github/scripts/modrinth-error-summary.jq \
                  /tmp/version.json 2>/dev/null)"; then
                printf 'Modrinth version creation error: %s\n' \
                  "$create_error_summary" >&2
              else
                echo 'Modrinth version creation returned a non-JSON error body; response body suppressed.' >&2
              fi
              echo "Modrinth version creation returned HTTP ${create_status}; expected required Fabric API project and TotemCore file plus optional TotemExcavation project." >&2
              exit 1
            fi
            if ! id="$(jq -er '.id | strings | select(length > 0)' /tmp/version.json)"; then
              fail_release 'Modrinth version creation response has no version ID.'
            fi
          fi

          fetch_modrinth_json 'published version' "version/${id}" /tmp/remote.json object
          if ! jq -e \
              --arg p "$p" \
              --arg v "$v" \
              --arg mc "$mc" \
              --arg f "$(basename "$artifact")" \
              --arg sha "$sha" \
              '.project_id==$p
               and .version_number==$v
               and .version_type=="release"
               and .game_versions==[$mc]
               and .loaders==["fabric"]
               and (([.files[] | select(.primary==true)][0] // .files[0]).filename==$f)
               and (([.files[] | select(.primary==true)][0] // .files[0]).hashes.sha512==$sha)' \
              /tmp/remote.json >/dev/null; then
            fail_release 'remote version does not match release, Minecraft 26.3, Fabric, file name, or SHA-512 metadata.'
          fi
          if ! jq -e \
              --arg fabric "$FABRIC_API_PROJECT_ID" \
              --arg core_file "$core_dependency_file" \
              --arg excavation "$excavation_dependency_project" \
              -f .github/scripts/verify-modrinth-remote-dependencies.jq \
              /tmp/remote.json >/dev/null; then
            if ! dependency_summary="$(jq -c \
                -f .github/scripts/modrinth-dependency-summary.jq /tmp/remote.json)"; then
              dependency_summary='{"dependency_count":null,"dependencies":[]}'
            fi
            printf 'Published Modrinth dependency summary: %s\n' "$dependency_summary" >&2
            fail_release 'remote dependencies must be required Fabric API, the exact TotemCore file or its Modrinth-normalized null placeholder, plus optional TotemExcavation.'
          fi

          if [[ "$DRY_RUN" == true ]]; then
            echo "Validated existing Modrinth ${v} release and artifact SHA-512 without mutation."
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
          echo "sha512=$sha" >> "$GITHUB_OUTPUT"

      - name: Submit project for public review
        if: steps.release.outputs.should_publish == 'true' && steps.release.outputs.dry_run == 'false' && steps.modrinth.outcome == 'success'
        shell: bash
        env:
          MODRINTH_TOKEN: '${{ secrets.MODRINTH_TOKEN }}'
          MODRINTH_PROJECT_ID: '${{ secrets.MODRINTH_PROJECT_ID }}'
        run: |
          set -euo pipefail
          api='https://api.modrinth.com/v2'
          args=(--fail --silent --show-error --retry 3 \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H 'User-Agent: Yunitrish006006/totem-automata-publisher/3.0')
          curl "${args[@]}" "$api/project/${MODRINTH_PROJECT_ID}" \
            >/tmp/project-before-review.json
          status="$(jq -er '.status' /tmp/project-before-review.json)"
          if [[ "$status" != 'approved' && "$status" != 'processing' ]]; then
            curl "${args[@]}" -X PATCH -H 'Content-Type: application/json' \
              --data '{"requested_status":"approved"}' \
              "$api/project/${MODRINTH_PROJECT_ID}" >/dev/null
          fi
          curl "${args[@]}" "$api/project/${MODRINTH_PROJECT_ID}" \
            >/tmp/project-after-review.json
          jq -e '.status == "approved" or .status == "processing" or .requested_status == "approved"' \
            /tmp/project-after-review.json >/dev/null

      - name: Record verified publication
        if: steps.release.outputs.should_publish == 'true' && steps.release.outputs.dry_run == 'false' && steps.modrinth.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          MOD_VERSION: '${{ steps.modrinth.outputs.version }}'
          VERSION_ID: '${{ steps.modrinth.outputs.version_id }}'
          SHA512: '${{ steps.modrinth.outputs.sha512 }}'
        run: |
          set -euo pipefail
          fail_marker() {
            echo "Publication marker failed: $1" >&2
            exit 1
          }

          [[ -n "$MOD_VERSION" && -n "$VERSION_ID" && -n "$SHA512" ]] \
            || fail_marker 'verified publication outputs are incomplete.'
          marker=".github/staging/modrinth-published-${MOD_VERSION}.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${marker}"
          body="$(jq -n \
            --arg v "$MOD_VERSION" \
            --arg id "$VERSION_ID" \
            --arg sha "$SHA512" \
            --arg run "$GITHUB_RUN_ID" \
            '{version:$v,release_type:"release",modrinth_version_id:$id,sha512:$sha,verified_by_run:$run}')"
          enc="$(printf '%s\n' "$body" | base64 -w0)"
          old="$(curl --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' "$api" \
            | jq -r '.sha // empty')"
          payload="$(jq -n \
            --arg m "release: record Modrinth ${MOD_VERSION}" \
            --arg c "$enc" \
            --arg b master \
            --arg s "$old" \
            'if $s=="" then {message:$m,content:$c,branch:$b} else {message:$m,content:$c,branch:$b,sha:$s} end')"
          if ! curl --fail --silent --show-error -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" -d "$payload" >/dev/null; then
            fail_marker 'GitHub rejected the verified publication marker.'
          fi
