name: Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  LIBGL_ALWAYS_SOFTWARE: '1'
  MESA_LOADER_DRIVER_OVERRIDE: llvmpipe

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Automata
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Mesa software rendering
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libgl1-mesa-glx libglx-mesa0 mesa-utils xserver-xorg-core xserver-xorg-video-dummy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Modrinth release gate
        shell: bash
        run: .github/scripts/check-modrinth-release-gate.sh

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: 424b90dc3929caa8c1afcfca7e63c50a64bde669
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Check out pinned TotemExcavation
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemExcavation
          ref: 87bc24076b9fb6fe3a64504f7b638d4ec0767c7c
          path: .lockstep/TotemExcavation
          persist-credentials: false

      - name: Build TotemCore
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .lockstep/TotemCore/gradlew
          ./.lockstep/TotemCore/gradlew -p .lockstep/TotemCore jar --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          test "$core_version" = '0.7.23'
          test -f ".lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"

      - name: Build TotemExcavation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .lockstep/TotemExcavation/gradlew
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          ./.lockstep/TotemExcavation/gradlew -p .lockstep/TotemExcavation \
            -PtotemCoreJar="$core_jar" jar --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          test "$excavation_version" = '0.1.16'
          test -f ".lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"

      - name: Compile TotemAutomata and GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"
          ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" -PtotemExcavationJar="$excavation_jar" \
            test assemble compileGametestJava --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace

      - name: Verify standalone runtime without TotemExcavation
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"
          marker_dir="${RUNNER_TEMP}/automata-standalone"
          rm -rf "$marker_dir"
          ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" -PtotemExcavationJar="$excavation_jar" \
            -PincludeTotemExcavationRuntime=false \
            -PtotemAutomataRestartProbePhase=standalone \
            -PtotemAutomataRestartProbeMarkerDir="$marker_dir" \
            runAutomataRestartProbe --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace
          test -f "$marker_dir/standalone.ok"
          test ! -f "$marker_dir/standalone.failure"

      - name: Run server GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"
          ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" -PtotemExcavationJar="$excavation_jar" \
            runGameTest --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace

      - name: Run client GameTests
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"
          export SDL_VIDEO_DRIVER=x11
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render +iglx -noreset" ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" -PtotemExcavationJar="$excavation_jar" \
            runClientGameTest --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace

      - name: Bind validated release artifact to this Build
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          archive="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          artifact="${archive}-${version}.jar"
          core_source="$(git -C .lockstep/TotemCore rev-parse HEAD)"
          test "$core_source" = 424b90dc3929caa8c1afcfca7e63c50a64bde669
          core_sha="$(sha512sum .lockstep/TotemCore/build/libs/totem-core-0.7.23.jar | awk '{print $1}')"
          test "$core_sha" = "$(jq -er .core_artifact_sha512 ".github/staging/release-validation-${version}.json")"
          sha="$(sha512sum "build/libs/${artifact}" | awk '{print $1}')"
          test "$sha" = "$(jq -er .sha512 ".github/staging/release-validation-${version}.json")"
          dependency_source="$(git -C .lockstep/TotemExcavation rev-parse HEAD)"
          test "$dependency_source" = 87bc24076b9fb6fe3a64504f7b638d4ec0767c7c
          dependency_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          test "$dependency_version" = 0.1.16
          dependency_sha="$(sha512sum .lockstep/TotemExcavation/build/libs/totem-excavation-0.1.16.jar | awk '{print $1}')"
          test "$dependency_sha" = "$(jq -er .excavation_artifact_sha512 ".github/staging/release-validation-${version}.json")"
          mkdir -p build/release-artifact
          cp "build/libs/${artifact}" build/release-artifact/
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg version "$version" --arg artifact "$artifact" --arg sha "$sha" --arg core_source "$core_source" --arg core_sha "$core_sha" --arg dependency_source "$dependency_source" --arg dependency_sha "$dependency_sha" '{repository:$repository,source_commit:$source,run_id:$run,run_attempt:$attempt,version:$version,artifact:$artifact,sha512:$sha,core_version:"0.7.23",core_source_commit:$core_source,core_artifact_sha512:$core_sha,excavation_source_commit:$dependency_source,excavation_version:"0.1.16",excavation_artifact_sha512:$dependency_sha}' > build/release-artifact/build-provenance.json

      - name: Upload immutable validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release-artifact/
          if-no-files-found: error
          retention-days: 14
