name: Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Automata
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Modrinth release gate
        shell: bash
        run: .github/scripts/check-modrinth-release-gate.sh

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: 71422749875072b585dcf64a4c9f42ee96773543
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Check out pinned TotemExcavation
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemExcavation
          ref: 6b54011195b81ec9a9a09146d162ba303ebd8ee4
          path: .lockstep/TotemExcavation
          persist-credentials: false

      - name: Build TotemCore
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .lockstep/TotemCore/gradlew
          ./.lockstep/TotemCore/gradlew -p .lockstep/TotemCore jar --no-daemon --stacktrace
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          test "$core_version" = '0.7.14'
          test -f ".lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"

      - name: Build TotemExcavation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .lockstep/TotemExcavation/gradlew
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          ./.lockstep/TotemExcavation/gradlew -p .lockstep/TotemExcavation \
            -PtotemCoreJar="$core_jar" jar --no-daemon --stacktrace
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          test "$excavation_version" = '0.1.8'
          test -f ".lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"

      - name: Compile TotemAutomata and GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"
          ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" -PtotemExcavationJar="$excavation_jar" \
            assemble compileGametestJava --no-daemon --stacktrace

      - name: Verify standalone runtime without TotemExcavation
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"
          marker_dir="${RUNNER_TEMP}/automata-standalone"
          rm -rf "$marker_dir"
          ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" -PtotemExcavationJar="$excavation_jar" \
            -PincludeTotemExcavationRuntime=false \
            -PtotemAutomataRestartProbePhase=standalone \
            -PtotemAutomataRestartProbeMarkerDir="$marker_dir" \
            runAutomataRestartProbe --no-daemon --stacktrace
          test -f "$marker_dir/standalone.ok"
          test ! -f "$marker_dir/standalone.failure"

      - name: Run server GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"
          ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" -PtotemExcavationJar="$excavation_jar" \
            runGameTest --no-daemon --stacktrace

      - name: Run client GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"
          xvfb-run -a ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" -PtotemExcavationJar="$excavation_jar" \
            runClientGameTest --no-daemon --stacktrace
