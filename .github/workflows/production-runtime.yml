name: Production Runtime

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  production-client-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out Automata
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Production validation must resolve pristine official-namespace
          # artifacts instead of the named development cache.
          cache-disabled: true

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: 71422749875072b585dcf64a4c9f42ee96773543
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Check out pinned TotemExcavation
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemExcavation
          ref: 6b54011195b81ec9a9a09146d162ba303ebd8ee4
          path: .lockstep/TotemExcavation
          persist-credentials: false

      - name: Build pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .lockstep/TotemCore/gradlew
          ./.lockstep/TotemCore/gradlew -p .lockstep/TotemCore \
            clean jar --no-daemon --stacktrace
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          test "$core_version" = '0.7.14'
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          test -f "$core_jar"

          ./.lockstep/TotemCore/gradlew -p .lockstep/TotemExcavation \
            -PtotemCoreJar="$core_jar" clean jar --no-daemon --stacktrace
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          test "$excavation_version" = '0.1.8'
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"
          test -f "$excavation_jar"

      - name: Run production-namespace client GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.14.jar"
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-0.1.8.jar"
          ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" -PtotemExcavationJar="$excavation_jar" \
            runProductionClientGameTest --no-daemon --stacktrace
