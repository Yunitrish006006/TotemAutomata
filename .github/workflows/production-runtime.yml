name: Production Runtime

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  LIBGL_ALWAYS_SOFTWARE: '1'
  MESA_LOADER_DRIVER_OVERRIDE: llvmpipe

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-client-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out Automata
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Mesa software rendering
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 mesa-utils x11-utils xserver-xorg-core xserver-xorg-video-dummy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Production validation must resolve pristine official-namespace
          # artifacts instead of the named development cache.
          cache-disabled: true

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: 424b90dc3929caa8c1afcfca7e63c50a64bde669
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Check out pinned TotemExcavation
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemExcavation
          ref: 87bc24076b9fb6fe3a64504f7b638d4ec0767c7c
          path: .lockstep/TotemExcavation
          persist-credentials: false

      - name: Build pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .lockstep/TotemCore/gradlew
          ./.lockstep/TotemCore/gradlew -p .lockstep/TotemCore \
            clean jar --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          test "$core_version" = '0.7.23'
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          test -f "$core_jar"

          ./.lockstep/TotemCore/gradlew -p .lockstep/TotemExcavation \
            -PtotemCoreJar="$core_jar" clean jar --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace
          excavation_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemExcavation/gradle.properties)"
          test "$excavation_version" = '0.1.16'
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-${excavation_version}.jar"
          test -f "$excavation_jar"

      - name: Run production-namespace client GameTests
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.23.jar"
          excavation_jar="${GITHUB_WORKSPACE}/.lockstep/TotemExcavation/build/libs/totem-excavation-0.1.16.jar"
          export SDL_VIDEO_DRIVER=x11
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" -PtotemExcavationJar="$excavation_jar" \
            runProductionClientGameTest --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace
